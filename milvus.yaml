quotaAndLimits:
  enabled: false
  limitWriting:
    memProtection:
      enabled: false
      dataNodeMemoryLowWaterLevel: 0.99
      dataNodeMemoryHighWaterLevel: 1.0
      queryNodeMemoryLowWaterLevel: 0.99
      queryNodeMemoryHighWaterLevel: 1.0
    diskProtection:
      enabled: false
      diskQuota: -1
    forceDeny:
      reading: false
      writing: false
    ttProtection:
      enabled: false

streaming:
  flush:
    memoryThreshold: 0.99
    growingSegmentBytesHwmThreshold: 0.99
    growingSegmentBytesLwmThreshold: 0.95
  walWriteAheadBuffer:
    capacity: 512m
    keepalive: 60s
  walReadAheadBuffer:
    length: 1024

woodpecker:
  client:
    segmentAppend:
      queueSize: 100000
      maxRetries: 10

